  :root{
    --cream:#F5EBE1;
    --paper:#EFE1D2;
    --paper-2:#E6D5C4;
    --paper-3:#DCC8B4;
    --ink:#54523F;
    --olive:#5E6B49;
    --rose:#C08D8F;
    --rose-dk:#A8707A;
    --rule:rgba(84,82,63,.20);
    --frame-w:clamp(46px,11vw,168px);
    --col:clamp(252px,71vw,470px);
    --serif:"SER",Georgia,"Times New Roman",serif;
    --script:"SCR","Snell Roundhand",cursive;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);font-weight:500;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden;height:100%}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ══ floral frame — grows upward like a vine ══ */
  .frame{position:fixed;top:-3%;height:106%;width:var(--frame-w);background-size:cover;
    background-repeat:no-repeat;z-index:0;pointer-events:none;
    -webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0);will-change:clip-path,transform}
  .frame-l{left:0;background-position:left center;
    -webkit-mask-image:linear-gradient(to right,#000 50%,rgba(0,0,0,0) 100%);
            mask-image:linear-gradient(to right,#000 50%,rgba(0,0,0,0) 100%)}
  .frame-r{right:0;background-position:right center;
    -webkit-mask-image:linear-gradient(to left,#000 50%,rgba(0,0,0,0) 100%);
            mask-image:linear-gradient(to left,#000 50%,rgba(0,0,0,0) 100%)}
  .opened .frame{animation:vine 3.4s cubic-bezier(.16,.7,.24,1) forwards}
  .opened .frame-r{animation-delay:.35s}
  @keyframes vine{from{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}
                  to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}

  /* ══ the envelope ══ */
  #gate{position:fixed;inset:0;z-index:30;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 42%,#FBF5EE 0%,var(--cream) 46%,#EDDFD1 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,5vh,46px);
    transition:opacity 1s ease .15s,visibility 1s}
  #gate.gone{opacity:0;visibility:hidden;pointer-events:none}

  .stage{perspective:1600px;perspective-origin:50% 34%}
  .env{position:relative;width:min(84vw,428px);aspect-ratio:1.46;transform-style:preserve-3d;
    cursor:pointer;animation:land 1.7s cubic-bezier(.16,.8,.2,1) both;
    transition:transform .9s cubic-bezier(.2,.7,.2,1)}
  @keyframes land{from{opacity:0;transform:translateY(56px) rotateX(26deg) scale(.92)}
                  to{opacity:1;transform:translateY(0) rotateX(9deg) scale(1)}}
  .env:hover{transform:translateY(-7px) rotateX(6deg)}
  .env.go{cursor:default;transform:translateY(0) rotateX(0deg)}
  .env::after{content:"";position:absolute;left:6%;right:6%;bottom:-9%;height:14%;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(84,82,63,.30),rgba(84,82,63,0) 70%);
    filter:blur(7px);transform:translateZ(-40px);transition:1.4s ease}
  .env.go::after{opacity:.35;transform:translateZ(-40px) scale(1.25)}

  .env-back{position:absolute;inset:0;border-radius:4px;background:var(--paper);
    box-shadow:0 26px 50px -30px rgba(84,82,63,.6),inset 0 0 0 1px rgba(84,82,63,.09)}
  .env-front{position:absolute;inset:0;z-index:3;border-radius:4px;overflow:hidden;
    background:linear-gradient(168deg,#F2E5D8,var(--paper) 42%,#E8D8C8);
    -webkit-clip-path:polygon(0 0,50% 47%,100% 0,100% 100%,0 100%);
            clip-path:polygon(0 0,50% 47%,100% 0,100% 100%,0 100%)}
  .env-front::before{content:"";position:absolute;inset:0;
    background:linear-gradient(104deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%,rgba(84,82,63,.06) 100%)}
  .env-front::after{content:"";position:absolute;left:0;right:0;top:0;height:52%;
    background:linear-gradient(180deg,rgba(84,82,63,.13),rgba(84,82,63,0) 62%);
    -webkit-clip-path:polygon(0 0,50% 90%,100% 0,100% 100%,0 100%);
            clip-path:polygon(0 0,50% 90%,100% 0,100% 100%,0 100%)}
  .motif{position:absolute;left:50%;bottom:12%;width:56%;transform:translateX(-50%);
    z-index:4;opacity:.5;pointer-events:none}
  .addr-line{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);z-index:4;
    font-size:clamp(8px,1.9vw,10px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(84,82,63,.42);white-space:nowrap}

  .flap{position:absolute;top:0;left:0;width:100%;height:47.4%;z-index:5;transform-origin:top center;
    backface-visibility:hidden;background:linear-gradient(180deg,var(--paper-2),var(--paper-3));
    -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%)}
  .env.go .flap{animation:flap 1.15s cubic-bezier(.6,.02,.3,1) .34s forwards}
  @keyframes flap{
    0%{transform:rotateX(0);z-index:5}
    49%{z-index:5}
    50%{z-index:0}
    100%{transform:rotateX(-177deg);z-index:0;background:linear-gradient(180deg,#EADCCC,var(--paper))}
  }

  .seal{position:absolute;left:50%;top:47.4%;z-index:7;transform:translate(-50%,-50%);
    width:clamp(66px,16vw,86px);height:clamp(66px,16vw,86px);border:none;padding:0;background:none;
    cursor:pointer;animation:pulse 4.6s ease-in-out infinite}
  .seal:focus-visible{outline:2px solid var(--olive);outline-offset:6px;border-radius:50%}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 5px 10px rgba(84,82,63,.45))}
                   50%{filter:drop-shadow(0 7px 18px rgba(168,112,122,.55))}}
  .half{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 34% 28%,#D8A2AC,var(--rose) 55%,#9E6470);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .half span{font-family:var(--script);font-size:clamp(30px,7.4vw,40px);line-height:1;
    color:rgba(255,255,255,.9);padding-bottom:.14em;text-shadow:0 1px 1px rgba(120,70,80,.4)}
  .half.l{-webkit-clip-path:inset(0 50% 0 0);clip-path:inset(0 50% 0 0)}
  .half.r{-webkit-clip-path:inset(0 0 0 50%);clip-path:inset(0 0 0 50%)}
  .env.go .seal{animation:none}
  .env.go .half.l{animation:breakL .95s cubic-bezier(.4,0,.75,.5) forwards}
  .env.go .half.r{animation:breakR 1s cubic-bezier(.4,0,.75,.5) .05s forwards}
  @keyframes breakL{0%{transform:none;opacity:1}
    18%{transform:translate(-5px,-3px) rotate(-7deg)}
    100%{transform:translate(-40px,96px) rotate(-52deg);opacity:0}}
  @keyframes breakR{0%{transform:none;opacity:1}
    18%{transform:translate(5px,-3px) rotate(7deg)}
    100%{transform:translate(42px,104px) rotate(58deg);opacity:0}}

  .card{position:absolute;left:8%;width:84%;bottom:4%;height:92%;z-index:2;
    background:linear-gradient(178deg,#FBF4EC,var(--cream) 55%,#F1E5D9);border-radius:2px;
    padding:9% 11%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;
    box-shadow:0 0 0 1px rgba(84,82,63,.12),0 16px 34px -22px rgba(84,82,63,.65)}
  .card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(94,107,73,.24)}
  .env.go .card{animation:pull 1.7s cubic-bezier(.22,.72,.18,1) 1.15s forwards}
  @keyframes pull{
    0%{transform:translateY(0) scale(1);z-index:6}
    58%{transform:translateY(-72%) scale(1.04);z-index:6}
    100%{transform:translateY(-84%) scale(1.85);opacity:0;z-index:6}}

  .petal{position:absolute;left:50%;top:44%;width:11px;height:8px;border-radius:60% 40% 55% 45%;
    z-index:6;opacity:0;pointer-events:none}
  .env.go .petal{animation:float 2.6s cubic-bezier(.3,.5,.4,1) forwards}
  @keyframes float{
    0%{opacity:0;transform:translate(0,0) rotate(0) scale(.5)}
    12%{opacity:.95}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.05)}
  }

  .gatehint{font-size:clamp(10px,2.4vw,12px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(84,82,63,.5);margin:0;animation:fadein 1.4s .9s both;transition:opacity .4s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  /* ══ page ══ */
  main{position:relative;z-index:1;padding:0 calc(var(--frame-w)*.8);max-width:1180px;margin:0 auto}
  section{padding:clamp(70px,12vh,132px) 0;display:flex;flex-direction:column;align-items:center;text-align:center}
  #hero{padding-top:clamp(52px,10vh,104px);padding-bottom:clamp(52px,9vh,100px)}
  .ph{display:block;width:100%;height:auto}

  .e-intro {width:calc(var(--col)*.943)}
  .e-orn1  {width:calc(var(--col)*.612); margin-top:calc(var(--col)*.037)}
  .e-gozde {width:calc(var(--col)*.702); margin-top:calc(var(--col)*.042)}
  .e-amp   {width:calc(var(--col)*.798); margin-top:calc(var(--col)*.046)}
  .e-furkan{width:calc(var(--col)*.829); margin-top:calc(var(--col)*.057)}
  .e-orn2  {width:calc(var(--col)*.467); margin-top:calc(var(--col)*.044)}
  .e-date  {width:calc(var(--col));      margin-top:calc(var(--col)*.024)}
  .e-year  {width:calc(var(--col)*.228); margin-top:calc(var(--col)*.010)}
  .e-orn3  {width:calc(var(--col)*.382); margin-top:calc(var(--col)*.031)}
  .e-time  {width:calc(var(--col)*.390); margin-top:calc(var(--col)*.046)}
  .e-orn4  {width:calc(var(--col)*.226)}
  .e-venue {width:calc(var(--col)*.658); margin-top:calc(var(--col)*.026)}
  .e-orn5  {width:calc(var(--col)*.671); margin-top:calc(var(--col)*.014)}
  .e-addr  {width:calc(var(--col)*.785); margin-top:calc(var(--col)*.008)}

  .wipe{position:relative;display:block}
  .wipe::after{content:"";position:absolute;top:-3%;bottom:-3%;left:-2%;right:-2%;
    background:var(--cream);transform-origin:right center;transform:scaleX(1)}
  .wipe.in::after{animation:unwipe 1.2s cubic-bezier(.45,.05,.2,1) forwards}
  @keyframes unwipe{to{transform:scaleX(0)}}
  .fade{opacity:0;transform:translateY(20px);
    transition:opacity 1.15s ease,transform 1.15s cubic-bezier(.2,.72,.2,1)}
  .fade.in{opacity:1;transform:none}
  .opened #hero .fade,.opened #hero .wipe::after{transition-delay:var(--d,0s);animation-delay:var(--d,0s)}

  .kicker{font-size:clamp(10px,2.4vw,12px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(84,82,63,.6);margin:0}
  .count{display:flex;justify-content:center;margin-top:clamp(20px,3.4vh,32px)}
  .cell{padding:0 clamp(10px,3.8vw,32px);position:relative;min-width:clamp(58px,17vw,100px)}
  .cell+.cell::before{content:"";position:absolute;left:0;top:12%;height:74%;width:1px;background:var(--rule)}
  .cell b{display:block;font-weight:500;font-size:clamp(30px,8vw,54px);color:var(--olive);
    line-height:1.06;font-variant-numeric:tabular-nums}
  .cell u{display:block;text-decoration:none;font-size:clamp(9px,2.1vw,11px);
    letter-spacing:.26em;text-transform:uppercase;color:rgba(84,82,63,.58);margin-top:.85em}

  .maplink{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive);
    font-size:clamp(11px,2.6vw,13px);letter-spacing:.24em;text-transform:uppercase;
    margin-top:clamp(26px,4.4vh,40px);padding:10px 4px 8px;border-bottom:1px solid var(--rule);
    transition:border-color .5s ease}
  .maplink svg{width:15px;height:15px;fill:none;stroke:var(--rose-dk);stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .5s ease}
  .maplink:hover{border-color:var(--olive)}
  .maplink:hover svg{transform:translateY(-2px)}
  .maplink:focus-visible{outline:2px solid var(--olive);outline-offset:5px}

  .cue{margin-top:clamp(34px,6vh,58px);display:flex;flex-direction:column;align-items:center;gap:9px}
  .cue span{font-size:clamp(9px,2.2vw,11px);letter-spacing:.3em;text-transform:uppercase;color:rgba(84,82,63,.45)}
  .cue svg{animation:bob 2.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

  footer{padding:clamp(30px,6vh,60px) 0 clamp(58px,9vh,96px);text-align:center;
    display:flex;flex-direction:column;align-items:center}

  @media (max-width:640px){
    main{padding:0 max(calc(var(--frame-w)*.5),14px)}
    .cell{padding:0 clamp(7px,3vw,18px);min-width:0}
  }
  @media (max-width:380px){ .cell b{font-size:29px} }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
    .frame{-webkit-clip-path:none!important;clip-path:none!important}
    .fade{opacity:1;transform:none}
    .wipe::after{display:none}
    html{scroll-behavior:auto}
  }
</style>

<script>
(function(){
  var body=document.body, gate=document.getElementById('gate'),
      env=document.getElementById('env'), hint=document.getElementById('hint'),
      reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function reveal(){
    body.classList.remove('locked');
    body.classList.add('opened');
    document.querySelectorAll('#hero .wipe,#hero .fade').forEach(function(el){ el.classList.add('in'); });
  }
  function open(){
    if(env.classList.contains('go')) return;
    env.classList.add('go');
    hint.style.opacity='0';
    if(reduce){ gate.classList.add('gone'); reveal(); setTimeout(function(){gate.style.display='none';},400); return; }
    setTimeout(function(){ gate.classList.add('gone'); }, 2500);
    setTimeout(reveal, 2700);
    setTimeout(function(){ gate.style.display='none'; }, 3700);
  }
  document.getElementById('openBtn').addEventListener('click',open);
  env.addEventListener('click',open);

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.2});
  document.querySelectorAll('#geri-sayim .fade,footer .fade').forEach(function(el){ io.observe(el); });

  if(!reduce){
    var fl=document.querySelector('.frame-l'), fr=document.querySelector('.frame-r'), t=false;
    window.addEventListener('scroll',function(){
      if(t) return; t=true;
      requestAnimationFrame(function(){
        var y=window.scrollY;
        fl.style.transform='translate3d(0,'+(y*-.035)+'px,0)';
        fr.style.transform='translate3d(0,'+(y*.035)+'px,0)';
        t=false;
      });
    },{passive:true});
  }

  var target=new Date('2026-09-05T19:30:00+03:00').getTime();
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var d=target-Date.now(); if(d<0) d=0;
    var s=Math.floor(d/1000);
    document.getElementById('dd').textContent=Math.floor(s/86400);
    document.getElementById('hh').textContent=pad(Math.floor(s%86400/3600));
    document.getElementById('mm').textContent=pad(Math.floor(s%3600/60));
    document.getElementById('ss').textContent=pad(s%60);
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
